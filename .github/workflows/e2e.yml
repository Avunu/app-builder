# The Apply path (app_builder_base/tests/e2e): write source, re-import the package and
# upgrade it in a live process, then check the database and the files agree. Odoo's test
# mode refuses to install, upgrade or reload a module, so `ci / test` covers everything
# around Apply and nothing of Apply itself; these probes are what does. They run on every
# pull request, so a Dependabot bump of OCB that moves the internals Apply leans on
# (load_openerp_module, MetaModel.module_to_models, _process_end) fails here.
#
# A local workflow, not one of odoo-nix's managed ones. It runs on a GitHub-hosted runner
# for every event, not on the fleet's self-hosted host: the repository is public, so
# hosted minutes cost nothing, and the self-hosted host is left to `ci / test`, which
# needs it. A hosted runner also never runs a fork's flake.nix anywhere it could persist.
name: e2e
on:
  push:
    branches: ["develop"]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FORCE_COLOR: "1"
jobs:
  probes:
    name: probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          # flake.nix's nixConfig, which Nix applies only with accept-flake-config.
          extra-conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      # What cache.nixos.org and devenv.cachix.org do not have (the Python environment,
      # the shell itself), kept between runs in the GitHub Actions cache.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      # Its own step, so the log shows what building and entering the shell cost apart from
      # the checks themselves.
      - name: The dev shell
        env:
          ODOO_NIX_CI: "1"
        run: nix develop --no-pure-eval -c true

      # A throwaway PostgreSQL cluster on a unix socket and free HTTP ports the kernel
      # picks: nothing two jobs on one host could meet on.
      - name: The Apply probes
        env:
          ODOO_NIX_CI: "1"
        run: nix develop --no-pure-eval -c scripts/ci-e2e.sh

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-probes
          path: |
            .odoo-nix/e2e/probes.log
            .odoo-nix/e2e/pg.log
          # .odoo-nix is a dot-directory: upload-artifact skips it without this.
          include-hidden-files: true
          if-no-files-found: warn
