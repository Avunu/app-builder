# The Apply path (app_builder_base/tests/e2e): write source, re-import the package and
# upgrade it in a live process, then check the database and the files agree. Odoo's test
# mode refuses to install, upgrade or reload a module, so `ci / test` covers everything
# around Apply and nothing of Apply itself; these probes are what does. They run on every
# pull request, so a Dependabot bump of OCB that moves the internals Apply leans on
# (load_openerp_module, MetaModel.module_to_models, _process_end) fails here.
#
# A local workflow, not one of odoo-nix's managed ones. It runs on a GitHub-hosted runner
# for every event, not on the fleet's self-hosted host: the repository is public, so
# hosted minutes cost nothing, and the self-hosted host is left to `ci / test`, which
# needs it. A hosted runner also never runs a fork's flake.nix anywhere it could persist.
name: e2e
on:
  push:
    branches: ["develop"]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FORCE_COLOR: "1"
jobs:
  probes:
    name: probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single-user Nix in seconds. It writes accept-flake-config = true; NIX_CONFIG, which
      # Nix applies after nix.conf, turns that off, so a pull request's flake.nix cannot
      # name substituters of its own. flake.nix's one (devenv.cachix.org) is set here.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      # The whole store as one GitHub Actions cache entry: what cache.nixos.org and
      # devenv.cachix.org do not have (OCB's source, the Python environment, odoo-nix's
      # tools) takes ~10 minutes to fetch and build. One entry, not a request per path:
      # magic-nix-cache is throttled by the cache service part way through a cold build.
      # Only a push or a manual run saves; a pull request restores the newest entry its
      # base branch saved (caches are scoped by ref) and builds only what its lockfiles
      # moved. The entry is the dev shell's closure: the step below roots it, and garbage
      # collection drops everything else before the save.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', '.odoo-series', 'nix/pyproject.toml', 'nix/uv.lock') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.event_name != 'pull_request' }}
          gc-max-store-size-linux: 7G

      # Its own step, so the log shows what building and entering the shell cost apart from
      # the checks themselves. --profile makes the shell a garbage-collection root.
      - name: The dev shell
        env:
          NIX_CONFIG: accept-flake-config = false
          ODOO_NIX_CI: "1"
        run: nix develop --no-pure-eval --profile "$RUNNER_TEMP/dev-shell" -c true

      # A throwaway PostgreSQL cluster on a unix socket and free HTTP ports the kernel
      # picks: nothing two jobs on one host could meet on.
      - name: The Apply probes
        env:
          NIX_CONFIG: accept-flake-config = false
          ODOO_NIX_CI: "1"
        run: nix develop --no-pure-eval -c scripts/ci-e2e.sh

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-probes
          path: |
            .odoo-nix/e2e/probes.log
            .odoo-nix/e2e/pg.log
          # .odoo-nix is a dot-directory: upload-artifact skips it without this.
          include-hidden-files: true
          if-no-files-found: warn
