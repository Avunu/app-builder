name: pre-commit

on:
  pull_request:
    branches:
      - "18.0*"
  push:
    branches:
      - "18.0"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Get python version
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        # pyright/tsc-typecheck/build-ts (.pre-commit-config.yaml, TYPING.md)
        # need this workspace's own .venv and node_modules, neither of
        # which exists in this checkout-only job. They run for real in
        # test.yml's `typecheck` job, inside the OCB container that has
        # both.
        run: >-
          pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: pyright,tsc-typecheck,build-ts,prettier-ts
