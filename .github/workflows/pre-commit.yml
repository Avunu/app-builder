name: pre-commit

on:
  pull_request:
    branches:
      - "18.0*"
  push:
    branches:
      - "18.0"

jobs:
  pre-commit:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.11"
      - name: Python 3.11 from Nix (self-hosted)
        if: runner.environment != 'github-hosted'
        run: |
          "$(nix build --no-link --print-out-paths nixpkgs#python311)/bin/python3" -m venv "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Get python version
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        # pyright/tsc-typecheck/build-ts/prettier-ts/eslint-ts
        # (.pre-commit-config.yaml, TYPING.md)
        # need this workspace's own .venv and node_modules, neither of
        # which exists in this checkout-only job. They run for real in
        # test.yml's `typecheck` job, inside the OCB container that has
        # both.
        run: >-
          pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: pyright,tsc-typecheck,build-ts,prettier-ts,eslint-ts
