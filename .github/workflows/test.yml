name: tests

on:
  pull_request:
    branches:
      - "18.0*"
  push:
    branches:
      - "18.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unreleased-deps:
    runs-on: [self-hosted, nixos]
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done

  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
            name: test with Odoo
            typeguard: ""
          # One flavor is enough for this: it checks our own tools/ against
          # their annotations, which do not differ between the two images.
          - container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
            name: test with OCB
            typeguard: "1"
    env:
      # TYPING.md, Phase 1e. Read by app_builder_base/__init__.py; empty means
      # off. The hook is proven live by app_builder_base/tests/test_typeguard.py.
      APP_BUILDER_TYPEGUARD: ${{ matrix.typeguard }}
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests

  # TYPING.md, "CI: what still needs the OCA container's real layout".
  # pyright/tsc need a real interpreter and real installed dependencies to
  # resolve imports against, not just a checkout, so this reuses the same
  # OCB container the `test` job uses rather than a plain ubuntu-latest
  # runner. One flavor (OCB) is enough: this checks our own code against
  # Odoo's public JS/Python surface, which does not differ between the
  # odoo.com and OCB containers for our purposes -- unlike `test`, which
  # runs both because runtime behavior can.
  typecheck:
    runs-on: ubuntu-22.04
    container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
    name: typecheck (pyright + tsc)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install addons and dependencies
        # Same step the `test` job runs: resolves and pip-installs every
        # addon here's actual Python dependencies (OCA wheelhouse
        # packages, this repo's own addons where something here depends
        # on them) into the container's venv, which is what lets pyright
        # resolve imports against real installed packages instead of
        # reporting everything external as unresolved.
        run: oca_install_addons
      - name: Mirror this repo's own addons under odoo.addons
        # oca_install_addons only guarantees Odoo's own *runtime* loader
        # knows about this checkout (a plain addons_path=...,. line); it
        # does nothing for a standalone pyright run, and not every addon
        # here is necessarily someone else's pip-resolved dependency.
        # See scripts/ci_addons_mirror.py's own docstring.
        run: python3 scripts/ci_addons_mirror.py
      - name: Install TS/typecheck tooling
        # The image already has Node 20 on PATH (Dockerfile: nodejs from
        # NodeSource, for rtlcss/less) -- no actions/setup-node needed,
        # and one less thing to behave unexpectedly inside a `container:`
        # job.
        run: npm ci
      - name: pyright
        run: npx pyright -p pyrightconfig.ci.json
      - name: tsc (this repo's own sources only)
        run: TSC_PROJECT=tsconfig.ci.json node scripts/typecheck.mjs
      - name: esbuild .ts -> .js is up to date
        run: node scripts/build_ts.mjs
      - name: prettier
        run: npx prettier --check '**/*.ts'
      - name: eslint
        # Type-aware (no-unsafe-*): catches an `any`/error type leaking in
        # from untyped Odoo JS that tsc, by design, lets through. Same
        # TSC_PROJECT switch as the tsc step above.
        run: TSC_PROJECT=tsconfig.ci.json npx eslint '**/*.ts'
