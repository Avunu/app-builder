# pyright, tsc and the type-aware eslint (TYPING.md). They need Odoo's sources and the
# dev shell's Python, which the lint gate's shell does not have, so they run here, on the
# manual stage of .pre-commit-config.yaml.
#
# It runs on a GitHub-hosted runner for every event, not on the fleet's self-hosted host:
# the repository is public, so hosted minutes cost nothing, and the self-hosted host is
# left to `ci / test`, which needs it. A hosted runner also never runs a fork's flake.nix
# anywhere it could persist. The Nix setup is the one e2e.yml uses.
name: typecheck
on:
  push:
    branches: ["develop"]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  typecheck:
    runs-on: ubuntu-latest
    # A run whose lockfiles have no cache entry yet builds the dev shell from nothing:
    # ~15-20 minutes before the checks start.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single-user Nix in seconds. It writes accept-flake-config = true; NIX_CONFIG, which
      # Nix applies after nix.conf, turns that off, so a pull request's flake.nix cannot
      # name substituters of its own. flake.nix's one (devenv.cachix.org) is set here.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      # The whole store as one GitHub Actions cache entry: what cache.nixos.org and
      # devenv.cachix.org do not have (OCB's source, the Python environment, odoo-nix's
      # tools) takes ~15 minutes to fetch and build. One entry, not a request per path:
      # magic-nix-cache is throttled by the cache service part way through a cold build.
      #
      # The key is the lockfiles. A push or a manual run whose key has no entry yet builds
      # from nothing and saves one, so an entry holds one dev shell and what its evaluation
      # fetched, never an older one's leftovers, and is not garbage-collected: that would
      # drop the sources evaluation fetches (the flake inputs, uv's git dependencies) and
      # cost minutes of re-fetching on every run. A pull request saves nothing; it restores
      # its base branch's entry (caches are scoped by ref), the newest one when its own
      # lockfiles moved, and builds only the difference.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', '.odoo-series', 'nix/pyproject.toml', 'nix/uv.lock') }}
          restore-prefixes-first-match: ${{ github.event_name == 'pull_request' && format('nix-devshell-{0}-{1}-', runner.os, runner.arch) || '' }}
          save: ${{ github.event_name != 'pull_request' }}

      # Its own step, so the log shows what building and entering the shell cost apart from
      # the checks themselves.
      - name: The dev shell
        env:
          NIX_CONFIG: accept-flake-config = false
          ODOO_NIX_CI: "1"
        run: nix develop --no-pure-eval -c true

      - name: pyright, tsc, eslint
        env:
          NIX_CONFIG: accept-flake-config = false
          ODOO_NIX_CI: "1"
        run: >-
          nix develop --no-pure-eval -c tools/.venv/bin/prek run
          -c .pre-commit-config.yaml --hook-stage manual --all-files
