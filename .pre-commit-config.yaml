exclude: |
  (?x)
  # NOT INSTALLABLE ADDONS
  # END NOT INSTALLABLE ADDONS
  # Generated by oca-gen-addon-readme; edit the readme fragments instead.
  ^[^/]+/README\.rst$|
  ^[^/]+/static/description/index\.html$|
  # Not our code.
  ^LICENSE$

default_language_version:
  python: python3

repos:
  - repo: https://github.com/sbidoul/whool
    rev: v1.3
    hooks:
      - id: whool-init

  - repo: https://github.com/oca/maintainer-tools
    rev: c08659518fb287683074f0a6aacda984815ac7b1
    hooks:
      # Keep README.rst in sync with the readme/ fragments and the manifest.
      - id: oca-gen-addon-readme
        args:
          - --addons-dir=.
          - --org-name=Avunu
          - --repo-name=odoo-studio
          - --branch=18.0
          - --if-source-changed
          - --keep-source-digest

  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.24
    hooks:
      # --fix so the mechanical ones (XML header, attribute order) are
      # corrected rather than reported, like every other fixer here. The
      # ordering it enforces is conditionals, then identity, then styling:
      # t-if/t-else/t-elif, then id/t-att-id, then class/t-att-class.
      - id: oca-checks-odoo-module
        args: [--fix]
      - id: oca-checks-po

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (README\.rst|\.pot?)$
      - id: end-of-file-fixer
        exclude: (README\.rst|\.pot?)$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
