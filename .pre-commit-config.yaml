exclude: |
  (?x)
  # NOT INSTALLABLE ADDONS
  # END NOT INSTALLABLE ADDONS
  # Generated by oca-gen-addon-readme; edit the readme fragments instead.
  ^[^/]+/README\.rst$|
  ^[^/]+/static/description/index\.html$|
  # Not our code.
  ^LICENSE$

default_language_version:
  python: python3

repos:
  - repo: https://github.com/sbidoul/whool
    rev: v1.3
    hooks:
      - id: whool-init

  - repo: https://github.com/oca/maintainer-tools
    rev: c08659518fb287683074f0a6aacda984815ac7b1
    hooks:
      # Keep README.rst in sync with the readme/ fragments and the manifest.
      - id: oca-gen-addon-readme
        args:
          - --addons-dir=.
          - --org-name=Avunu
          - --repo-name=odoo-studio
          - --branch=18.0
          - --if-source-changed
          - --keep-source-digest

  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.24
    hooks:
      # --fix so the mechanical ones (XML header, attribute order) are
      # corrected rather than reported, like every other fixer here. The
      # ordering it enforces is conditionals, then identity, then styling:
      # t-if/t-else/t-elif, then id/t-att-id, then class/t-att-class.
      - id: oca-checks-odoo-module
        args: [--fix]
      - id: oca-checks-po

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (README\.rst|\.pot?)$
      - id: end-of-file-fixer
        exclude: (README\.rst|\.pot?)$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # TYPING.md. Local, not a hosted repo: each needs this workspace's own
  # .venv (pyright) or node_modules (tsc/esbuild), neither of which the
  # plain `pre-commit run --all-files` job in pre-commit.yml has -- that
  # job SKIPs all three by name; test.yml's `typecheck` job is where they
  # actually run, inside the OCB container that has both. The transpiler
  # guard (`app_builder_base/tests/test_assets.py`) needs a real Odoo
  # checkout, not just node, so it runs only as part of the Python suite
  # (README's `--test-tags`), not here.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: npx pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: tsc-typecheck
        name: tsc --noEmit (own sources only, see scripts/typecheck.mjs)
        entry: node scripts/typecheck.mjs
        language: system
        files: \.ts$
        pass_filenames: false
      - id: build-ts
        name: esbuild .ts -> .js (fails if the emitted .js is out of date)
        entry: node scripts/build_ts.mjs
        language: system
        files: \.ts$
        pass_filenames: false
      - id: prettier-ts
        name: prettier --write (.ts, see .prettierrc.json)
        entry: npx prettier --write
        language: system
        files: \.ts$
      # No eslint hook: eslint.config.mjs's own top-of-file comment (and
      # TYPING.md, Known traps) explain why it is not enforced yet -- it
      # currently reports spurious findings that npm run typecheck (the
      # real checker) does not.
