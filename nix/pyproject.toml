[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

# Legacy sdist-only dependencies that do not declare setuptools as a build
# dependency. Maintained from uv.lock (odoo-nix-build-deps).
[tool.uv.extra-build-dependencies]
# >>> odoo-nix: sdist build deps (managed) >>>
"docopt" = ["setuptools"]
"odoo" = ["setuptools"]
"ofxparse" = ["setuptools"]
"python-ldap" = ["setuptools"]
"rjsmin" = ["setuptools"]
"vobject" = ["setuptools"]
# <<< odoo-nix: sdist build deps (managed) <<<

[tool.odoo-nix]
schema = 1
profile = "github:Avunu/odoo-standards-profile/v1"
repo = "Avunu/app-builder"
integration-branch = "develop"

[tool.odoo-nix.js-xml]
# ES modules, which the managed eslint config parses as scripts. .ts has its own.
exclude = ["scripts/", "eslint.typescript.config.mjs"]

[tool.odoo-nix.python-lint]
# On top of OCA's set: the annotation discipline of TYPING.md.
extra-select = ["ANN", "FA", "PGH003", "PYI", "TCH"]
ignore = [
    # Odoo's _() takes %-style placeholders so translation extraction can find
    # them, so f-strings are not an option in user-facing messages.
    "UP031",
    # _inherit / _sql_constraints are Odoo class attributes, not dataclass fields.
    "RUF012",
    # `self`/`cls` need no annotation. The locked ruff still has these two rules.
    "ANN101",
    "ANN102",
    # `Any` is the honest type at real, traced boundaries (TYPING.md Phase 1c).
    "ANN401",
]

[tool.odoo-nix.python-lint.per-file-ignores]
"__manifest__.py" = ["ANN"]
"*/tests/*" = ["ANN"]
"*/migrations/*" = ["ANN"]
